name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# NOTE: no job caches its CMake build directory.
# A CMakeCache.txt stores CMAKE_MAKE_PROGRAM, the compiler and CMAKE_COMMAND as
# ABSOLUTE paths. Restoring one into a runner whose toolchain lives somewhere
# else fails at project() with "no such file or directory". That is exactly what
# broke the Linux job from 2026-06-19 onwards: lukka/get-cmake installs its ninja
# under a per-run temp directory, and restore-keys handed every later run a cache
# pointing at a path that no longer existed. The Windows job carries the same
# latent fault via its MSVC paths whenever the runner image updates.
# If build caching is wanted, use ccache/sccache — they key on file content, not
# on absolute paths.

jobs:
  build-windows:
    name: Windows (MSVC / VS 2026)
    runs-on: windows-2025-vs2026

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Configure (VS 2026 Release preset)
        run: cmake --preset release

      - name: Build
        run: cmake --build --preset release

      - name: Test
        run: ctest --test-dir build/release -C Release --output-on-failure

  build-linux:
    name: Linux (GCC / Ninja)
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup CMake + Ninja
        # Pinned rather than @latest: this is a third-party action in the build
        # path, and a floating branch can move under us.
        uses: lukka/get-cmake@v4.4.2

      - name: Install JUCE Linux dependencies
        # Read from tools/linux-build-deps.txt rather than listed here, so that
        # this job and tools/build-linux-docker.sh cannot disagree about what a
        # Linux build needs. They disagreeing is how libxi-dev went missing: the
        # list existed only in this file, so the only machine that could find
        # out it was wrong was a runner, after a push.
        run: |
          set -o pipefail
          packages=$(grep -vE '^[[:space:]]*(#|$)' tools/linux-build-deps.txt)
          # An empty or missing list must not pass for "installed". GitHub's
          # default shell is `bash -e` with NO pipefail, so the obvious
          # `grep ... | xargs apt-get install` exits 0 when the file is gone:
          # grep's failure is discarded by the pipe, xargs runs the command
          # once with no package names, and apt-get with no arguments is a
          # no-op. Missing compile deps would fail the build a step later --
          # but xvfb is not a compile dep. Losing that one builds green, skips
          # registering all three smoke tests, and reports 100% passed on one.
          test -n "$packages" || { echo 'tools/linux-build-deps.txt yielded no packages' >&2; exit 1; }
          echo "$packages"
          sudo apt-get update -qq
          echo "$packages" | xargs -r sudo apt-get install -y --no-install-recommends

      - name: Configure (Ninja Release preset)
        # Pin the make program to the stable apt path so the generator can never
        # latch onto get-cmake's temp-dir ninja.
        #
        # REQUIRE_SMOKE_TESTS turns a missing xvfb-run into a configure failure.
        # Without it, losing xvfb registered none of the three smoke tests and
        # ctest reported "100% tests passed" having run one test instead of four
        # -- the failure the apt guard above is written against, reached by any
        # route other than an empty package list.
        run: >-
          cmake --preset ninja-release
          -DCMAKE_MAKE_PROGRAM=/usr/bin/ninja
          -DLIGHTHOST_REQUIRE_SMOKE_TESTS=ON

      - name: Build
        run: cmake --build build/ninja-release -j$(nproc)

      - name: Test
        run: ctest --test-dir build/ninja-release --output-on-failure

  build-macos:
    name: macOS (Clang / Ninja)
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup CMake + Ninja
        uses: lukka/get-cmake@v4.4.2

      - name: Configure (Ninja Release preset)
        run: cmake --preset ninja-release

      - name: Build
        run: cmake --build build/ninja-release -j$(sysctl -n hw.ncpu)

      - name: Test
        run: ctest --test-dir build/ninja-release --output-on-failure
