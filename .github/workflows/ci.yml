name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# NOTE: no job caches its CMake build directory.
# A CMakeCache.txt stores CMAKE_MAKE_PROGRAM, the compiler and CMAKE_COMMAND as
# ABSOLUTE paths. Restoring one into a runner whose toolchain lives somewhere
# else fails at project() with "no such file or directory". That is exactly what
# broke the Linux job from 2026-06-19 onwards: lukka/get-cmake installs its ninja
# under a per-run temp directory, and restore-keys handed every later run a cache
# pointing at a path that no longer existed. The Windows job carries the same
# latent fault via its MSVC paths whenever the runner image updates.
# If build caching is wanted, use ccache/sccache — they key on file content, not
# on absolute paths.

jobs:
  build-windows:
    name: Windows (MSVC / VS 2026)
    runs-on: windows-2025-vs2026

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Configure (VS 2026 Release preset)
        run: cmake --preset release

      - name: Build
        run: cmake --build --preset release

      - name: Test
        run: ctest --test-dir build/release -C Release --output-on-failure

  build-linux:
    name: Linux (GCC / Ninja)
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup CMake + Ninja
        # Pinned rather than @latest: this is a third-party action in the build
        # path, and a floating branch can move under us.
        uses: lukka/get-cmake@v4.4.2

      - name: Install JUCE Linux dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            ninja-build \
            xvfb \
            libasound2-dev \
            libjack-jackd2-dev \
            libfreetype-dev \
            libfontconfig1-dev \
            libx11-dev \
            libxcomposite-dev \
            libxcursor-dev \
            libxext-dev \
            libxinerama-dev \
            libxrandr-dev \
            libxrender-dev \
            libxi-dev \
            libglu1-mesa-dev \
            mesa-common-dev

      - name: Configure (Ninja Release preset)
        # Pin the make program to the stable apt path so the generator can never
        # latch onto get-cmake's temp-dir ninja.
        run: cmake --preset ninja-release -DCMAKE_MAKE_PROGRAM=/usr/bin/ninja

      - name: Build
        run: cmake --build build/ninja-release -j$(nproc)

      - name: Test
        run: ctest --test-dir build/ninja-release --output-on-failure

  build-macos:
    name: macOS (Clang / Ninja)
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup CMake + Ninja
        uses: lukka/get-cmake@v4.4.2

      - name: Configure (Ninja Release preset)
        run: cmake --preset ninja-release

      - name: Build
        run: cmake --build build/ninja-release -j$(sysctl -n hw.ncpu)

      - name: Test
        run: ctest --test-dir build/ninja-release --output-on-failure
