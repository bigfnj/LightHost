name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-windows:
    name: Windows (MSVC / VS 2026)
    runs-on: windows-2025-vs2026

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Cache CMake build
        uses: actions/cache@v4
        with:
          path: build/release
          key: windows-release-${{ hashFiles('CMakeLists.txt', 'CMakePresets.json') }}
          restore-keys: windows-release-

      - name: Configure (VS 2026 Release preset)
        run: cmake --preset release

      - name: Build
        run: cmake --build --preset release

      - name: Test
        run: ctest --test-dir build/release -C Release --output-on-failure

  build-linux:
    name: Linux (GCC / Ninja)
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup CMake (>= 4.2)
        uses: lukka/get-cmake@latest
        # ubuntu-24.04 ships CMake 3.31; we require 4.2+ for the VS 2026 generator.
        # Linux uses Ninja so the generator itself doesn't matter here, but
        # cmake_minimum_required(4.2) is enforced regardless.

      - name: Install JUCE Linux dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            ninja-build \
            libasound2-dev \
            libjack-jackd2-dev \
            libfreetype-dev \
            libfontconfig1-dev \
            libx11-dev \
            libxcomposite-dev \
            libxcursor-dev \
            libxext-dev \
            libxinerama-dev \
            libxrandr-dev \
            libxrender-dev \
            libglu1-mesa-dev \
            mesa-common-dev

      # NOTE: deliberately NOT caching build/ninja-release.
      # A cached CMakeCache.txt stores CMAKE_MAKE_PROGRAM as an absolute path.
      # lukka/get-cmake installs its ninja under a per-run temp directory
      # (/home/runner/work/_temp/<random>/ninja), so a restored cache pointed at
      # a path that no longer existed and every configure failed with
      # "no such file or directory" at project(). Broke CI 2026-06-19; the
      # Release workflow stayed green precisely because it has no such cache.
      # If build-time caching is wanted later, use ccache — it caches compiler
      # output rather than a build tree full of absolute paths.

      - name: Configure (Ninja Release preset)
        # Pin the make program to the stable apt path so the generator can never
        # latch onto get-cmake's temp-dir ninja again.
        run: cmake --preset ninja-release -DCMAKE_MAKE_PROGRAM=/usr/bin/ninja

      - name: Build
        run: cmake --build build/ninja-release -j$(nproc)

      - name: Test
        run: ctest --test-dir build/ninja-release --output-on-failure
