name: Release

on:
  push:
    tags:
      - 'v[0-9]*'

jobs:
  build-windows:
    name: Build Windows Release
    runs-on: windows-2025-vs2026

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Configure
        run: cmake --preset release

      - name: Build
        run: cmake --build --preset release

      # Do not publish a release that fails its own tests.
      - name: Test
        run: ctest --test-dir build/release -C Release --output-on-failure

      - name: Package Windows artifact
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}"
          $exeDir  = "build\release\LightHost_artefacts\Release"
          $zipName = "LightHost-${version}-windows-x64.zip"
          Compress-Archive -Path "$exeDir\Light Host.exe" -DestinationPath $zipName

      - name: Upload Windows zip
        uses: actions/upload-artifact@v7
        with:
          name: windows-release
          path: LightHost-${{ github.ref_name }}-windows-x64.zip
          retention-days: 1

  build-linux:
    name: Build Linux Release
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup CMake + Ninja
        # ubuntu-24.04 packages CMake 3.28.3, below the floor the VS 2026
        # generator forces on this project. Pinned, not @latest: a third-party
        # action in the release path should not float.
        uses: lukka/get-cmake@v4.4.2

      - name: Install JUCE Linux dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            ninja-build \
            xvfb \
            libasound2-dev \
            libjack-jackd2-dev \
            libfreetype-dev \
            libfontconfig1-dev \
            libx11-dev \
            libxcomposite-dev \
            libxcursor-dev \
            libxext-dev \
            libxinerama-dev \
            libxrandr-dev \
            libxrender-dev \
            libglu1-mesa-dev \
            mesa-common-dev

      - name: Configure
        # Pin the make program to the stable apt path, matching ci.yml.
        run: cmake --preset ninja-release -DCMAKE_MAKE_PROGRAM=/usr/bin/ninja

      - name: Build
        run: cmake --build build/ninja-release -j$(nproc)

      # Do not publish a release that fails its own tests.
      - name: Test
        run: ctest --test-dir build/ninja-release --output-on-failure

      - name: Package Linux artifact
        run: |
          VERSION="${{ github.ref_name }}"
          # JUCE places the binary under <artefacts>/Release/ even for single-config Ninja
          BIN_DIR="build/ninja-release/LightHost_artefacts/Release"
          TAR_NAME="LightHost-${VERSION}-linux-x64.tar.gz"
          ls -la "$BIN_DIR"
          tar -czf "$TAR_NAME" -C "$BIN_DIR" "Light Host"

      - name: Upload Linux tarball
        uses: actions/upload-artifact@v7
        with:
          name: linux-release
          path: LightHost-${{ github.ref_name }}-linux-x64.tar.gz
          retention-days: 1

  create-release:
    name: Create GitHub Release
    runs-on: ubuntu-24.04
    needs: [build-windows, build-linux]
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: dist

      - name: Extract release notes from CHANGELOG.md
        run: |
          VERSION="${{ github.ref_name }}"
          VER="${VERSION#v}"
          awk "/^## \[${VER}\]/{found=1; next} found && /^## \[/{exit} found{print}" \
              CHANGELOG.md > release_notes.md
          echo "----- Release notes preview -----"
          cat release_notes.md
          echo "----- end -----"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: LightHost ${{ github.ref_name }}
          body_path: release_notes.md
          draft: false
          prerelease: false
          files: |
            dist/windows-release/*.zip
            dist/linux-release/*.tar.gz