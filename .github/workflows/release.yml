name: Release

# Fires on a version tag. A tag carrying a prerelease suffix (v5.0.0-rc1) produces
# a draft marked prerelease; a clean tag (v5.0.0) publishes. See RELEASING.md.
on:
  push:
    tags:
      - 'v[0-9]*'

jobs:
  build-windows:
    name: Build Windows Release
    runs-on: windows-2025-vs2026

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Configure
        run: cmake --preset release

      - name: Build
        run: cmake --build --preset release

      # Do not publish a release that fails its own tests.
      - name: Test
        run: ctest --test-dir build/release -C Release --output-on-failure

      - name: Package Windows artifact
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}"
          $exeDir  = "build\release\LightHost_artefacts\Release"
          $staging = "staging\LightHost-$version"

          New-Item -ItemType Directory -Path $staging -Force | Out-Null
          Copy-Item "$exeDir\Light Host.exe" -Destination $staging

          # The application is conveyed under AGPLv3, so the licence travels with
          # the binary rather than being left behind in the repository.
          Copy-Item license, agpl-3.0.txt, gpl.txt, third_party, README.md -Destination $staging

          Compress-Archive -Path $staging -DestinationPath "LightHost-$version-windows-x64.zip"

      - name: Upload Windows zip
        uses: actions/upload-artifact@v7
        with:
          name: windows-release
          path: LightHost-${{ github.ref_name }}-windows-x64.zip
          retention-days: 1

  build-linux:
    name: Build Linux Release
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup CMake + Ninja
        # ubuntu-24.04 packages CMake 3.28.3, below the floor the VS 2026
        # generator forces on this project. Pinned, not @latest: a third-party
        # action in the release path should not float.
        uses: lukka/get-cmake@v4.4.2

      - name: Install JUCE Linux dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            ninja-build \
            xvfb \
            libasound2-dev \
            libjack-jackd2-dev \
            libfreetype-dev \
            libfontconfig1-dev \
            libx11-dev \
            libxcomposite-dev \
            libxcursor-dev \
            libxext-dev \
            libxinerama-dev \
            libxrandr-dev \
            libxrender-dev \
            libxi-dev \
            libglu1-mesa-dev \
            mesa-common-dev

      - name: Configure
        # Pin the make program to the stable apt path, matching ci.yml.
        run: cmake --preset ninja-release -DCMAKE_MAKE_PROGRAM=/usr/bin/ninja

      - name: Build
        run: cmake --build build/ninja-release -j$(nproc)

      # Do not publish a release that fails its own tests.
      - name: Test
        run: ctest --test-dir build/ninja-release --output-on-failure

      - name: Package Linux artifact
        run: |
          VERSION="${{ github.ref_name }}"
          # JUCE places the binary under <artefacts>/Release/ even for single-config Ninja
          BIN_DIR="build/ninja-release/LightHost_artefacts/Release"
          STAGING="staging/LightHost-${VERSION}"

          mkdir -p "$STAGING"
          cp "$BIN_DIR/Light Host" "$STAGING/"
          cp license agpl-3.0.txt gpl.txt third_party README.md "$STAGING/"

          tar -czf "LightHost-${VERSION}-linux-x64.tar.gz" -C staging "LightHost-${VERSION}"

      - name: Upload Linux tarball
        uses: actions/upload-artifact@v7
        with:
          name: linux-release
          path: LightHost-${{ github.ref_name }}-linux-x64.tar.gz
          retention-days: 1

  build-macos:
    name: Build macOS Release
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup CMake + Ninja
        uses: lukka/get-cmake@v4.4.2

      - name: Configure
        run: cmake --preset ninja-release

      - name: Build
        run: cmake --build build/ninja-release -j$(sysctl -n hw.ncpu)

      # Do not publish a release that fails its own tests.
      - name: Test
        run: ctest --test-dir build/ninja-release --output-on-failure

      - name: Package macOS artifact
        run: |
          VERSION="${{ github.ref_name }}"
          APP_DIR="build/ninja-release/LightHost_artefacts/Release"
          STAGING="staging/LightHost-${VERSION}"

          mkdir -p "$STAGING"
          # ditto rather than cp -r or zip: it is the only tool that reliably
          # preserves a bundle's symlinks and permissions.
          ditto "$APP_DIR/Light Host.app" "$STAGING/Light Host.app"
          cp license agpl-3.0.txt gpl.txt third_party README.md "$STAGING/"

          ditto -c -k --sequesterRsrc --keepParent \
                "$STAGING" "LightHost-${VERSION}-macos-universal.zip"

      - name: Upload macOS zip
        uses: actions/upload-artifact@v7
        with:
          name: macos-release
          path: LightHost-${{ github.ref_name }}-macos-universal.zip
          retention-days: 1

  create-release:
    name: Create GitHub Release
    runs-on: ubuntu-24.04
    needs: [build-windows, build-linux, build-macos]
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: dist

      - name: Classify the tag
        id: tag
        run: |
          TAG="${{ github.ref_name }}"

          # A prerelease suffix (v5.0.0-rc1) means a draft marked prerelease, so a
          # candidate can be inspected without ever becoming the Latest release.
          if [[ "$TAG" == *-* ]]; then
            echo "draft=true"      >> "$GITHUB_OUTPUT"
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
            echo "This is a release candidate: it will be created as a draft."
          else
            echo "draft=false"      >> "$GITHUB_OUTPUT"
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          fi

          # The changelog is keyed on the released version, so a candidate reads
          # the section of the version it is a candidate for.
          VERSION="${TAG#v}"
          echo "version=${VERSION%%-*}" >> "$GITHUB_OUTPUT"

      - name: Extract release notes from CHANGELOG.md
        run: |
          VER="${{ steps.tag.outputs.version }}"

          awk "/^## \[${VER}\]/{found=1; next} found && /^## \[/{exit} found{print}" \
              CHANGELOG.md > release_notes.md

          # Empty notes used to publish an empty release body and say nothing about
          # it. The usual cause is tagging before renaming the [Unreleased] heading.
          if [ ! -s release_notes.md ]; then
            echo "::error::CHANGELOG.md has no '## [${VER}]' section. Rename the [Unreleased] heading before tagging."
            exit 1
          fi

          echo "----- Release notes preview -----"
          cat release_notes.md
          echo "----- end -----"

      - name: Collect artifacts and checksum them
        run: |
          mkdir -p release-files
          find dist -type f \( -name '*.zip' -o -name '*.tar.gz' \) -exec cp {} release-files/ \;

          cd release-files
          # Named explicitly: a bare * would include SHA256SUMS itself, which the
          # redirect has already created by the time the glob expands.
          sha256sum LightHost-* > SHA256SUMS
          cat SHA256SUMS

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: LightHost ${{ github.ref_name }}
          body_path: release_notes.md
          draft: ${{ steps.tag.outputs.draft }}
          prerelease: ${{ steps.tag.outputs.prerelease }}
          fail_on_unmatched_files: true
          files: release-files/*
